<html lang="en"><head><meta charset="utf-8">

<title>T R Loukya — UI/UX Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe0;--card:#fffaf0;--ink:#000;--yel:#f4dc72;--grn:#4f7f3f;--grnl:#b6d6a4;--sh:0 8px 24px rgba(90,70,20,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#f6efe0}}
html{scroll-behavior:smooth;scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Nunito,system-ui,sans-serif}
h1,h2{font-family:Fraunces,Georgia,serif;color:var(--yel);text-shadow:2px 2px 0 #000;margin:0;line-height:1.05}
h1{font-size:clamp(2.6rem,8vw,5rem)}h2{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:.4em}
h3{font-family:Fraunces,serif;font-size:1.15rem;color:var(--grn);margin:0 0 .3em}
.sm{font-weight:700;color:var(--grn);margin:0 0 .4em}
section{max-width:1080px;margin:0 auto;padding:72px 20px}
nav{position:sticky;top:0;z-index:20;background:rgba(246,239,224,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--grnl);padding-top:env(safe-area-inset-top,0px)}
nav .in{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;min-height:56px}
nav b{font-family:Fraunces,serif}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}
nav a{display:block;padding:10px 12px;color:#000;text-decoration:none;border-radius:20px;font-weight:600}
nav a:hover,a:focus-visible,button:focus-visible{outline:3px solid var(--grn);outline-offset:2px}
#mb{display:none;min-height:44px;min-width:44px;border:2px solid var(--grnl);background:var(--card);border-radius:12px;font-size:1.2rem}
@media(max-width:780px){#mb{display:block}nav ul{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:8px 20px 16px;border-bottom:2px solid var(--grnl)}nav ul.open{display:flex}}
.card{background:var(--card);border:2px solid var(--grnl);border-radius:22px;box-shadow:var(--sh);padding:22px}
.btn{display:inline-block;min-height:44px;padding:11px 22px;border-radius:999px;border:2px solid #000;background:var(--yel);color:#000;font:700 1rem Nunito;text-decoration:none;cursor:pointer}
.btn.alt{background:var(--card)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center;min-height:80vh}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.world{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin:auto;border-radius:50% 50% 46% 54%/55% 45% 55% 45%;background:radial-gradient(circle at 50% 40%,#fff6cf,#e7f0cf 70%);border:2px solid var(--grnl);box-shadow:var(--sh)}
.obj{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid #000;background:var(--card);font-size:1.9rem;cursor:pointer;display:grid;place-items:center;box-shadow:3px 4px 0 rgba(0,0,0,.85);animation:fl 5s ease-in-out infinite;transition:transform .2s}
.obj:hover{transform:scale(1.12)}
@keyframes fl{50%{transform:translateY(-8px)}}
.pfp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36%;aspect-ratio:1;border-radius:50%;border:3px dashed var(--grn);background:var(--card);display:grid;place-items:center;text-align:center;font-size:.8rem;overflow:hidden}
.pfp img{width:100%;height:100%;object-fit:cover}
.curio{position:absolute;left:50%;top:52%;width:38%;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-54%)}}
.curio svg{width:100%;height:auto;overflow:visible;display:block}
.curio .pup{transition:transform .12s}
.curio .eyes{transform-origin:100px 108px;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.curio .sp{transform-origin:100px 52px}
.curio.wig .sp{animation:wig .6s}
@keyframes wig{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.bub{position:absolute;left:50%;top:15%;transform:translate(-50%,6px);opacity:0;background:var(--card);border:2px solid #000;border-radius:16px;padding:6px 14px;font-weight:700;font-size:.95rem;white-space:nowrap;transition:.3s;pointer-events:none;z-index:3}
.bub.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.bub{font-size:.8rem;padding:5px 10px}}
.sc{height:190px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:2.6rem;flex-wrap:wrap;overflow:hidden}
.sc span{display:inline-block;animation:pop .5s both;animation-delay:calc(var(--i)*.14s)}
@keyframes pop{from{transform:scale(0) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.sc .fade{animation:pop .5s both,fade 1s 1s forwards}.sc .star{animation:pop .5s both,grow 1s 1s forwards}
@keyframes fade{to{opacity:.15;transform:scale(.55);filter:grayscale(1)}}@keyframes grow{to{transform:scale(1.6)}}
.sc .spin{animation:pop .5s both,sp 2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.sc .fly{animation:pop .5s both,fly 1.4s .6s ease-in forwards}@keyframes fly{to{transform:translateY(-120px) scale(1.3);opacity:0}}
.dots{display:flex;gap:2px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border:0;background:none;cursor:pointer;position:relative}
.dots button:after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--grnl);border:1.5px solid #000}
.dots button.on:after{background:var(--yel);inset:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-block;padding:4px 12px;border:2px solid var(--grnl);border-radius:99px;margin:3px;font-weight:600;background:var(--card)}
.slot{position:relative;border:2px dashed var(--grn);border-radius:16px;background:repeating-linear-gradient(45deg,#fffaf0,#fffaf0 12px,#f3ecd8 12px,#f3ecd8 24px);min-height:180px;display:grid;place-items:center;text-align:center;padding:12px;font-size:.9rem;overflow:hidden}
.slot img{width:100%;height:auto;display:block;border-radius:12px}
.edit .slot{cursor:pointer;outline:3px dotted #c26}
.step{display:grid;grid-template-columns:1fr 1.1fr;gap:24px;align-items:center;margin:34px 0}
.step:nth-child(even) .pair{order:2}.pair{display:grid;gap:12px}.slot img{max-height:560px;width:auto;max-width:100%;margin:auto}.step:nth-child(even) .slot{transform:rotate(1.2deg)}
.step:nth-child(odd) .slot{transform:rotate(-1.2deg)}
@media(max-width:700px){.step{grid-template-columns:1fr}.step:nth-child(even) .pair{order:0}}
.proj-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.proj-tabs button.on{background:var(--yel)}
.track{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 14px}
.track button{flex:0 0 auto;min-width:52px;min-height:52px;border-radius:50%;border:2px solid #000;background:var(--card);font-size:1.4rem;cursor:pointer}
.track button.on{background:var(--yel);transform:scale(1.12)}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
@media(max-width:700px){.stage{grid-template-columns:1fr}}
.mood{height:170px;border-radius:18px;border:2px solid var(--grnl);display:grid;place-items:center;font-size:3.6rem;transition:background .5s}
.desk{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.desk button{min-width:84px;min-height:84px;border-radius:20px;border:2px solid #000;background:var(--card);font-size:2.2rem;cursor:pointer;box-shadow:3px 4px 0 #000}
.desk button.on{background:var(--yel)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;background:var(--card);border:2px solid #000;border-radius:99px;padding:10px 20px;font-weight:700;transition:.35s;z-index:50;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
.edit [data-k]{outline:1px dashed #c26;min-height:1em}
#bar{display:none;position:fixed;right:12px;top:calc(64px + env(safe-area-inset-top,0px));z-index:30;gap:6px;flex-wrap:wrap;max-width:300px;justify-content:flex-end}
.edit #bar{display:flex}
footer{text-align:center;padding:30px 20px 50px;font-size:.9rem}
footer button{background:none;border:0;color:#000;text-decoration:underline;cursor:pointer;font:inherit;min-height:44px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

 <section id="work"><h2>${E("work.h")}</h2><p style="max-width:60ch">${E("work.intro")}</p>
 <div class="proj-tabs">${D.work.projects.map((p,i)=>`<button class="btn alt ${i==PROJ?"on":""}" data-p="${i}">${esc(p.name)}</button>`).join("")}</div>${project(D.work.projects[PROJ]||D.work.projects[0],PROJ)}</section>
 <section id="process"><h2>${E("process.h")}</h2><p>${E("process.intro")}</p><div class="card"><div class="track" role="tablist">${D.process.steps.map((s,i)=>`<button data-s="${i}" class="${i==STEP?"on":""}" aria-label="Step ${i+1}">${s[0]}</button>`).join("")}</div>
 <div class="stage"><div class="mood" id="mood" style="background:${D.process.steps[STEP][3]}">${D.process.steps[STEP][0]}</div><div><h3>Step ${STEP+1} of ${D.process.steps.length}</h3><p style="font-size:1.2rem;font-weight:700;margin:0 0 6px">${E("process.steps."+STEP+".1")}</p><p>${E("process.steps."+STEP+".2")}</p>
 <button class="btn alt" data-n="-1">Back</button> <button class="btn" data-n="1">Next</button></div></div></div></section>
 <section id="skills"><h2>${E("skills.h")}</h2><p>${E("skills.intro")}</p><div class="desk">${D.skills.items.map((s,i)=>`<button data-k2="${i}" aria-label="${esc(s[1])}">${s[0]}</button>`).join("")}</div><div class="card" id="sk" aria-live="polite"><h3>${E("skills.items.0.1")}</h3><p>${E("skills.items.0.2")}</p></div><p style="margin-top:16px">${E("skills.open")}</p></section>
 <section id="resume"><h2>${E("resume.h")}</h2><div class="grid2"><div>${D.resume.edu.map((_,i)=>`<h3>${E("resume.edu."+i+".0")}</h3><p style="margin-top:0">${E("resume.edu."+i+".1")}</p>`).join("")}<p>${E("resume.journey")}</p></div>
 <div class="card"><h3>Experience</h3><p><b>${E("resume.exp.0")}</b></p><p>${E("resume.exp.1")}</p><p>${E("resume.certs")}</p><a class="btn" href="${esc(D.contact.linkedin)}">See my LinkedIn</a></div></div></section>
 <section id="contact"><h2>${E("contact.h")}</h2><div class="card"><p><b>Email:</b> <a href="mailto:${esc(D.contact.email)}">${E("contact.email")}</a></p><p><b>LinkedIn:</b> <a href="${esc(D.contact.linkedin)}">${E("contact.linkedin")}</a></p><p><b>Phone:</b> <a href="tel:${esc(D.contact.phone.replace(/\s/g,""))}">${E("contact.phone")}</a></p><p>${E("contact.loc")}</p></div></section>`;
 $("footer span").outerHTML=E("foot");
 document.body.classList.toggle("edit",EDIT);bind();
}
function project(p,pi){return `<div class="card"><h3>${E("work.projects."+pi+".tag")}</h3><p style="margin:0">${E("work.projects."+pi+".summary")}</p></div>`+p.steps.map((s,i)=>{const b=`work.projects.${pi}.steps.${i}`;return `<div class="step"><div class="pair">${slot(b+".img",s.alt,s.cap)}${s.sk!==undefined?slot(b+".sk",s.alt2,s.cap2):""}</div><div><p class="sm">${E(b+".h")}</p><p>${E(b+".t")}</p></div></div>`}).join("")+`<div class="card"><h3>How this design solves the problem</h3><p style="margin:0">${E("work.projects."+pi+".solves")||""}</p></div>`+(EDIT?`<p><button class="btn alt" data-delp="${pi}">Delete this project</button></p>`:"")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
const CM=["Hmm, how does that work? 🔍","Ooh, what's this? 👀","What if it were simpler? 💡","Don't forget to smile. ☀️","Take a tiny break. 🌼","Water a plant today. 🌱"];let cmi=0,cmt;
function curioBind(){const c=$("#curio");if(!c)return;
 document.onpointermove=e=>{const r=c.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/150)*6;c.querySelectorAll(".pup").forEach(p=>p.style.transform=`translate(${dx/d*k}px,${dy/d*k}px)`)};
 c.onclick=()=>{const b=$("#bub");b.textContent=CM[cmi++%CM.length];b.classList.add("show");c.classList.remove("wig");void c.offsetWidth;c.classList.add("wig");clearTimeout(cmt);cmt=setTimeout(()=>b.classList.remove("show"),2800)}}
const SCN=[["A user is struggling with something that should be easy.",["😣","📱","❓|spin"]],["I notice the problem and wonder why it happens.",["👩","👀","😣"]],["I study it: watch, ask questions, take notes.",["👩","🔍","📝","💬"]],["A bunch of ideas show up.",["💡","💡","💡","💡","💡","💡"]],["I narrow them down to the one that solves the real problem.",["💡|fade","💡|fade","💡|star","💡|fade","💡|fade"]],["We talk it through as a group.",["👩","💬","🧑","💬","👨"]],["I design the solution.",["✏️","📐","📱"]],["I share it with the user to see if it works for them.",["👩","📱","🤔"]],["Not quite? Back to improve it, again.",["🔁|spin","✏️","📱"]],["Now the user is happy.",["📱","😊","✅"]],["Finally, it gets published.",["📱","🚀|fly"]]];
let sti=0,stt=null,stp=false;
function storyShow(i){sti=i;$("#sc").innerHTML=SCN[i][1].map((x,k)=>{const[e,c]=x.split("|");return `<span style="--i:${k}" class="${c||""}">${e}</span>`}).join("");$("#scap").textContent=SCN[i][0];document.querySelectorAll("#dots button").forEach((b,k)=>{b.classList.toggle("on",k==i);b.setAttribute("aria-current",k==i)})}
function storyBind(){clearInterval(stt);const sc=$("#sc");if(!sc)return;
 $("#dots").innerHTML=SCN.map((s,k)=>`<button aria-label="Step ${k+1}: ${s[0]}" data-st="${k}"></button>`).join("");
 document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{storyShow(+b.dataset.st);stp=true;$("#spl").textContent="Play"});
 const run=()=>{clearInterval(stt);stt=setInterval(()=>{if(!stp)storyShow((sti+1)%SCN.length)},3400)};
 stp=matchMedia("(prefers-reduced-motion: reduce)").matches;$("#spl").textContent=stp?"Play":"Pause";
 $("#spl").onclick=()=>{stp=!stp;$("#spl").textContent=stp?"Play":"Pause"};
 storyShow(0);run()}
function bind(){curioBind();storyBind();
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{toast(D.world[b.dataset.i].msg);setTimeout(()=>document.getElementById(b.dataset.go).scrollIntoView({behavior:"smooth"}),500)});
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{PROJ=+b.dataset.p;render();$("#work").scrollIntoView()});
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{STEP=+b.dataset.s;render()});
 document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{STEP=Math.max(0,Math.min(D.process.steps.length-1,STEP+ +b.dataset.n));render();$(".track .on").scrollIntoView({inline:"center",block:"nearest"})});
 document.querySelectorAll("[data-k2]").forEach(b=>b.onclick=()=>{const i=+b.dataset.k2;document.querySelectorAll("[data-k2]").forEach(x=>x.classList.toggle("on",x==b));$("#sk").innerHTML=`<h3>${E("skills.items."+i+".1")}</h3><p>${E("skills.items."+i+".2")}</p>`;$("#sk").querySelectorAll("[data-k]").forEach(inp)});
 const pl=$("#plant");if(pl)pl.onclick=()=>{pl.textContent=["🌿","🪴","🌼"][Math.floor(Math.random()*3)];pl.style.transform="scale(1.25)";toast("Water a plant today. 🌱")};
 document.querySelectorAll("[data-k]").forEach(inp);
 document.querySelectorAll("[data-img]").forEach(s=>s.onclick=()=>{if(!EDIT)return;const f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=()=>pick(f.files[0],s.dataset.img);f.click()});
 document.querySelectorAll("[data-delp]").forEach(b=>b.onclick=()=>{if(confirm("Delete this project?")){D.work.projects.splice(+b.dataset.delp,1);PROJ=0;render()}});
}
function inp(el){el.oninput=()=>{set(el.dataset.k,el.textContent)}}
function pick(file,path){if(!file)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=1400,k=Math.min(1,m/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);set(path,c.toDataURL("image/jpeg",.8));render()};im.src=r.result};r.readAsDataURL(file)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));toast("Saved in this browser")}catch(e){toast("Too many images to store here. Use Export JSON.")}}
$("#mb").onclick=()=>{const o=$("#nl").classList.toggle("open");$("#mb").setAttribute("aria-expanded",o)};
$("#nl").onclick=()=>$("#nl").classList.remove("open");
$("#ed").onclick=()=>{if(EDIT){EDIT=false;render();return}const p=prompt("Edit password");if(p===D.pw){EDIT=true;render();toast("Edit mode on: click any text or image")}else if(p!==null)toast("Wrong password")};
$("#sv").onclick=save;
$("#ex").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:"application/json"}));a.download="portfolio-content.json";a.click()};
$("#im").onclick=()=>{const f=document.createElement("input");f.type="file";f.accept=".json";f.onchange=()=>f.files[0].text().then(t=>{D=JSON.parse(t);render();toast("Imported")});f.click()};
$("#rs").onclick=()=>{if(confirm("Reset all content to the starter version?")){localStorage.removeItem(KEY);D=JSON.parse(JSON.stringify(DEFAULT));render()}};
$("#ad").onclick=()=>{const n=prompt("New project name");if(n){D.work.projects.push(mk(n,{tag:"Mobile App UX/UI Design",sum:"Describe this project."}));PROJ=D.work.projects.length-1;render()}};
render();
</script></body></html>
